experiment_name: frz_verimon

monitors:
  - identifier: VeriMon
    name: VeriMon-correct
    branch: master
    commit: bc752d37f1d4560b5667eddac9dd1670451b758e
  # - identifier: VeriMon
  #   name: VeriMon-const-rel
  #   branch: const-relation-propagation
  #   commit: f75212ed94208a12eda6205185ad8dce8bfe744a
  # - identifier: VeriMon
  #   name: VeriMon-caching
  #   branch: const-relation-propagation
  #   commit: d6bcab634286da4a70b740bd092fa7049095ac73
  - identifier: MonPoly
    name: MonPoly-frz
    branch: master
    commit: bc752d37f1d4560b5667eddac9dd1670451b758e
    params:
      nofilteremptytp: true

# # Uncomment the following lines to enable the oracle
# oracles:
#   - identifier: VeriMonOracle
#     name: VeriMonOracle
#     monitor_name: VeriMon-correct

# oracle:
#   enabled: true
#   name: VeriMonOracle

generation_constraints:
  guard_type: Oracle
  guard_name: VeriMonOracle
  upper_bound: 1800

runtime_constraints:
  upper_bound: 30

data_setup:
  type: SignatureContract
  SignatureContract:
    trace_length: 1000
    event_rate: 10

policy_setup:
  type: ImmediatePolicyContract
  ImmediatePolicyContract:
    format: MFOTL
    delimiter: ;
    frz_atemporal:        "a(x:int) b(x:int); FRZ q(x) = a(x) IN q(x)"
    frz_temporal:         "a(x:int) b(x:int); FRZ q(x) = a(x) IN a(x) AND ((q(x) AND b(y) AND x > 0) UNTIL[0,5] (a(x) AND b(y)))"


synthetic_config:
  data_source: SignatureGenerator
  policy_source: GenFmaGenerator
  experiment:
    num_operators: [1,2]
    num_data_set_sizes: [500, 1000, 2000, 4000, 8000, 10000, 20000]


seeds:
  '[1, 0, 0]': [0, 0]
  '[2, 0, 0]': [0, 1]


tools_to_build:
  - VeriMon-correct
  # - VeriMon-const-rel
  # - VeriMon-caching
  - MonPoly-frz
