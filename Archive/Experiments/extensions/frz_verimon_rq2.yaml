experiment_name: frz_verimon

monitors:
  - identifier: VeriMon
    name: VeriMon-correct
    branch: master
  - identifier: VeriMon
    name: VeriMon-const-rel
    commit: 76fd7ecdfe9eb3de63a3e1d6cc5815f8b00034ce
  - identifier: VeriMon
    name: VeriMon-caching
    commit: 69dcbdb788b879cfb0c9db7b9d153be56dfe3bdb
  - identifier: MonPoly
    name: MonPoly-frz
    commit: bc752d37f1d4560b5667eddac9dd1670451b758e
    params:
      nofilteremptytp: true

oracles:
  - identifier: VeriMonOracle
    name: VeriMonOracle
    monitor_name: VeriMon-correct

oracle:
  enabled: true
  name: VeriMonOracle

runtime_constraints:
  upper_bound: 30

data_setup:
  type: SignatureContract
  SignatureContract:
    trace_length: 1000
    event_rate: 10

policy_setup:
  type: ImmediatePolicyContract
  ImmediatePolicyContract:
    format: MFOTL
    delimiter: ;
    frz_complex:        "a(x:int) b(x:int); FRZ q(x) = a(x) IN ONCE[0,5] q(x)"
    frz_medium:         "a(x:int) b(x:int); FRZ q(x) = a(x) IN q(x) AND b(x)"
    frz_simple:         "a(x:int) b(x:int); FRZ q(x) = a(x) IN q(x)"

tools_to_build:
  - VeriMon-correct
  - VeriMon-const-rel
  - VeriMon-caching
  - MonPoly-frz

synthetic_config:
  data_source: SignatureGenerator
  policy_source: GenFmaGenerator
  experiment:
    num_operators: [1,2,3]
    num_data_set_sizes: [1000]

seeds:
  '[1, 0, 0, 1000]': [0, 0]
  '[2, 0, 0, 1000]': [0, 1]
  '[3, 0, 0, 1000]': [0, 2]
